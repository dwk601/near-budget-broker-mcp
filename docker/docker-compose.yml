# HARD TRUST BOUNDARY: agents with same-user Docker socket access can docker exec,
# inspect secrets, or mount the named volume. Deny agents Docker access; use a
# separate OS user/sandbox. Encryption does NOT protect an unlocked daemon.
services:
  daemon:
    image: ${BB_IMAGE:-budget-broker:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    environment:
      BB_MASTER_SECRET_FILE: /run/secrets/bb_master
    secrets: [bb_master, bb_config]
    volumes:
      - bb_data:/var/lib/budget-broker
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    ports:
      - "127.0.0.1:3210:3210"
      - "127.0.0.1:3211:3211"
# Read-only services require FILE secrets (environment/content sources cannot
# be materialized by Compose on a read-only rootfs). Use protected 0600 files in
# a 0700 directory OUTSIDE the repository and inaccessible to agent OS users.
# These paths are deliberately required: no insecure in-repository defaults.
secrets:
  bb_master:
    file: ${BB_MASTER_FILE:?set protected master secret file path}
  bb_config:
    file: ${BB_CONFIG_FILE:?set protected config secret file path}
volumes:
  bb_data:
    name: ${BB_DATA_VOLUME:-budget-broker-data}
