# Compose >=2.24.4; merge AFTER docker/docker-compose.yml.
# Set BB_IMAGE to a separately trusted image tag/digest; npm tarball has no src.
# Base BB_MASTER_FILE / BB_CONFIG_FILE secrets and BB_DATA_VOLUME are preserved.
# Omit compose build; compose create must initialize the volume before provisioning.
# Do not change loopback publications or mount the fresh volume at another target.
services:
  daemon:
    build: !reset null
